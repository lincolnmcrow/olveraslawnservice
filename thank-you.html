<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Thank You | Olvera's Lawn Service</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
        }

        body {
            background-color: #F6F7F2;
            color: #142118;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #E3E7E1;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(20, 33, 24, 0.1);
        }

        .check {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1B4332;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        h1 span {
            color: #1B4332;
        }

        p {
            color: #56655C;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-main {
            display: inline-block;
            background-color: #1B4332;
            color: #ffffff;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 999px;
            text-decoration: none;
        }

        .btn-main:hover {
            background-color: #14331F;
        }
    </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W36ZPFXP2P"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-W36ZPFXP2P');</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="tel:"],a[href^="mailto:"]');if(a)gtag('event',a.getAttribute('href').indexOf('tel:')===0?'phone_click':'email_click',{link_url:a.getAttribute('href')})},true);</script>
<script>(function(){try{var s=sessionStorage,k='crow_src';if(!s.getItem(k)){var q=new URLSearchParams(location.search),r='';try{r=new URL(document.referrer).hostname.replace(/^www\./,'')}catch(e){}if(r===location.hostname.replace(/^www\./,''))r='';s.setItem(k,JSON.stringify({s:(q.get('utm_source')||r||'direct')+(q.get('utm_medium')?' / '+q.get('utm_medium'):''),l:location.pathname}))}document.addEventListener('DOMContentLoaded',function(){var v=JSON.parse(s.getItem(k)||'{}');document.querySelectorAll('input[name=lead_source]').forEach(function(i){i.value=v.s||''});document.querySelectorAll('input[name=lead_landing]').forEach(function(i){i.value=v.l||''})})}catch(e){}})();</script>
<script>gtag('event','generate_lead',{form_name:'website_form'});</script>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>Thanks for <span>Reaching Out</span></h1>
        <p>Your quote request has been submitted. We'll review the details and get back to you shortly at the phone number or address you provided.</p>
        <a href="index.html" class="btn-main">Back to Home</a>
    </div>
</body>
</html>
