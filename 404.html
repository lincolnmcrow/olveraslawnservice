<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Olvera's Lawn Service</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
        }

        body {
            background-color: #F6F7F2;
            color: #142118;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #E3E7E1;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(20, 33, 24, 0.1);
        }

        .check {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1B4332;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        h1 span {
            color: #1B4332;
        }

        p {
            color: #56655C;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-main {
            display: inline-block;
            background-color: #1B4332;
            color: #ffffff;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 999px;
            text-decoration: none;
        }

        .btn-main:hover {
            background-color: #14331F;
        }
    </style>

        <div class="check">?</div>
